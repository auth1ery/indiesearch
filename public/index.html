<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IndieSearch</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>IndieSearch</h1>
<p>search the indie web!</p>
<input type="text" id="search" placeholder="my site...">
<ul id="results"></ul>

<script>
const searchInput = document.getElementById('search');
const resultsList = document.getElementById('results');
let index = [];

fetch('/index.json')
  .then(res => res.json())
  .then(data => index = data);

searchInput.addEventListener('input', () => {
  const query = searchInput.value.toLowerCase();
  resultsList.innerHTML = '';

  const results = index
    .map(item => ({
      ...item,
      matchScore: (item.title.toLowerCase().includes(query) || item.description.toLowerCase().includes(query)) ? 1 : 0
    }))
    .sort((a,b) => b.matchScore - a.matchScore || new Date(b.lastScraped) - new Date(a.lastScraped));

  results.forEach(item => {
    const li = document.createElement('li');
    li.innerHTML = `<a href="${item.url}" target="_blank">${item.title}</a> — ${item.description}`;
    resultsList.appendChild(li);
  });
});
</script>

</body>
</html>
