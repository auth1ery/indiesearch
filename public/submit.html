<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>submit your site</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h1>submit your site</h1>
    <input type="url" id="siteURL" placeholder="site URL" required>
    <input type="text" id="siteDesc" placeholder="description (optional)">
    <br>
    <button id="submitBtn">submit</button>
    <p id="msg"></p>
    <br>
    <a href="/">← back to search</a>
</div>
<script>
const submitBtn = document.getElementById('submitBtn');
const siteURL = document.getElementById('siteURL');
const siteDesc = document.getElementById('siteDesc');
const msg = document.getElementById('msg');

submitBtn.addEventListener('click', async () => {
    const url = siteURL.value.trim();
    const description = siteDesc.value.trim();
    
    if(!url) { 
        msg.style.color = 'red';
        msg.textContent = 'URL required!! dont give me nothin'; 
        return; 
    }
    
    msg.style.color = '#666';
    msg.textContent = 'checking...';
    
    const res = await fetch('/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url, description })
    });
    const data = await res.json();
    
    if(data.success) {
        msg.style.color = 'green';
        msg.textContent = 'submission sent!!! awaiting review.';
        siteURL.value = '';
        siteDesc.value = '';
    } else {
        msg.style.color = 'red';
        msg.textContent = data.error || 'something went wrong';
    }
});
</script>
</body>
</html>
